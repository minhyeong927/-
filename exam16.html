<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let score = prompt('성적을 입력하세요. 90이상 1, 80이상 90미만 2, 70이상 80미만 3, 60이상 70미만 4, 60미만이면 5를 입력하세요.');
    switch (score) {
        case '1':
            alert('a학점입니다.');
            break;
        case '2':
            alert('b학점입니다.');
            break;
        case '3':
            alert('c학점입니다.');
            break;
        case '4':
            alert('d학점입니다.');
            break;
        case '5':
            alert('f학점입니다.');
            break;
        default:
            alert('잘못된 입력입니다.');
    }
</script>
<body>
    <h1>학점 계산기</h1>
</body>
</html>

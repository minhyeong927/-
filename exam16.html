<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let score = prompt('성적을 입력하세요.');
    switch (parseInt(score/10)) {
        case 10:
        case 9:
            alert('a학점입니다.');
            break;
        case 8:
            alert('b학점입니다.');
            break;
        case 7:
            alert('c학점입니다.');
            break;
        case 6:
            alert('d학점입니다.');
            break;
        default:
            alert('f학점입니다.');
    }
</script>
<body>
    <h1>학점 계산기</h1>
</body>
</html>

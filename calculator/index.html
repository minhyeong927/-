<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Calculator</title>
  <style>
    /* ===== 테마 변수: --hue는 JS가 파티클 색에 맞춰 실시간으로 바꾼다 ===== */
    :root {
      --hue: 200;
      --accent: hsl(var(--hue) 95% 68%);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 7vw;
      overflow: hidden;
      background: #05060f;
      color: #e9ecf5;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Malgun Gothic", "Segoe UI", sans-serif;
    }

    /* ===== 3D 배경 캔버스 ===== */
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      cursor: crosshair;
    }

    /* ===== 계산기 (유리 질감) ===== */
    .calculator {
      position: relative;
      z-index: 1;
      width: 320px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55),
        0 0 40px hsl(var(--hue) 90% 60% / 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .display {
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
    }

    .display input {
      display: block;
      width: 100%;
      padding: 0;
      border: none;
      background: transparent;
      text-align: right;
      font-family: inherit;
      color: #f1f3f9;
      outline: none;
    }

    #expression {
      height: 20px;
      font-size: 14px;
      color: rgba(233, 236, 245, 0.5);
    }

    #result {
      height: 48px;
      font-size: 36px;
      font-weight: 600;
      text-shadow: 0 0 18px hsl(var(--hue) 90% 60% / 0.6);
    }

    #result.long {
      font-size: 26px;
    }

    #result.longer {
      font-size: 20px;
    }

    #result.longest {
      font-size: 16px;
    }

    #result.error {
      color: #ff5c5c;
      text-shadow: 0 0 18px rgba(255, 60, 60, 0.7);
    }

    #message {
      height: 20px;
      margin: 6px 4px 12px;
      font-size: 13px;
      color: #ff7b7b;
      text-align: right;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .keys button {
      height: 56px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
      color: #e9ecf5;
      font-family: inherit;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s, box-shadow 0.15s;
    }

    .keys button:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    .keys button:active,
    .keys button.pressed {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 18px hsl(var(--hue) 90% 60% / 0.45);
    }

    .keys button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .key-fn {
      background: rgba(255, 255, 255, 0.12);
      font-size: 18px;
    }

    .key-op {
      color: var(--accent);
      font-weight: 600;
    }

    /* 연산자를 누르고 다음 숫자를 기다리는 동안 강조 (Apple 계산기와 같은 피드백) */
    .keys .key-op.active {
      background: var(--accent);
      color: #05060f;
      box-shadow: 0 0 18px hsl(var(--hue) 90% 60% / 0.5);
    }

    .keys .key-eq {
      border: none;
      background: linear-gradient(135deg,
          hsl(var(--hue) 90% 58%),
          hsl(calc(var(--hue) + 60) 90% 55%));
      color: #fff;
    }

    /* ===== 좌측 하단 상태 표시 ===== */
    #hud {
      position: fixed;
      left: 20px;
      bottom: 16px;
      z-index: 1;
      margin: 0;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.04em;
      color: rgba(233, 236, 245, 0.45);
      pointer-events: none;
      white-space: pre;
    }

    /* ===== 좁은 화면: 계산기는 아래, 3D는 위 ===== */
    @media (max-width: 760px) {
      body {
        justify-content: center;
        align-items: flex-end;
        padding: 0 0 20px;
      }

      .calculator {
        width: min(320px, 92vw);
      }

      #hud {
        display: none;
      }
    }
  </style>
</head>
<body>

  <canvas id="scene" aria-hidden="true"></canvas>

  <form id="calculator" class="calculator" aria-label="계산기" autocomplete="off">
    <div class="display">
      <input type="text" id="expression" aria-label="계산식" readonly tabindex="-1">
      <input type="text" id="result" value="0" aria-label="결과" readonly tabindex="-1">
    </div>

    <p id="message" role="alert" aria-live="assertive"></p>

    <!-- iOS 26 계산기 배치: ⌫ AC % ÷ / 7 8 9 × / 4 5 6 − / 1 2 3 + / ± 0 . = -->
    <div class="keys">
      <button type="button" class="key-fn" data-action="backspace" aria-label="한 글자 지우기">⌫</button>
      <button type="button" class="key-fn" data-action="clear" aria-label="전체 지우기">AC</button>
      <button type="button" class="key-fn" data-action="percent" aria-label="퍼센트">%</button>
      <button type="button" class="key-op" data-action="operator" data-value="/" aria-label="나누기">÷</button>

      <button type="button" data-action="digit" data-value="7">7</button>
      <button type="button" data-action="digit" data-value="8">8</button>
      <button type="button" data-action="digit" data-value="9">9</button>
      <button type="button" class="key-op" data-action="operator" data-value="*" aria-label="곱하기">×</button>

      <button type="button" data-action="digit" data-value="4">4</button>
      <button type="button" data-action="digit" data-value="5">5</button>
      <button type="button" data-action="digit" data-value="6">6</button>
      <button type="button" class="key-op" data-action="operator" data-value="-" aria-label="빼기">−</button>

      <button type="button" data-action="digit" data-value="1">1</button>
      <button type="button" data-action="digit" data-value="2">2</button>
      <button type="button" data-action="digit" data-value="3">3</button>
      <button type="button" class="key-op" data-action="operator" data-value="+" aria-label="더하기">+</button>

      <button type="button" class="key-fn" data-action="sign" aria-label="부호 바꾸기">±</button>
      <button type="button" data-action="digit" data-value="0">0</button>
      <button type="button" data-action="dot" aria-label="소수점">.</button>
      <button type="submit" class="key-eq" data-action="equals" aria-label="계산하기">=</button>
    </div>
  </form>

  <p id="hud"></p>

  <!-- ================================================================
       PART 1. 계산기 로직
       화면(3D)과 직접 연결하지 않고, 입력이 끝날 때마다
       'calc:input' 커스텀 이벤트만 발생시킨다. (느슨한 결합)
       ================================================================ -->
  <script>
    (function () {
      'use strict';

      const MAX_DIGITS = 15;
      const OP_SYMBOLS = { '+': '+', '-': '−', '*': '×', '/': '÷' };

      const form = document.getElementById('calculator');
      const resultEl = document.getElementById('result');
      const exprEl = document.getElementById('expression');
      const msgEl = document.getElementById('message');
      const clearBtn = form.querySelector('[data-action="clear"]');
      const opButtons = form.querySelectorAll('[data-action="operator"]');

      // ===== 입력 모델 (Apple 계산기 방식: 식 전체를 저장했다가 = 에서 우선순위대로 계산) =====
      // tokens = [피연산자, 연산자, 피연산자, 연산자, ...]
      // 피연산자(operand) = { digits: '12.5', neg: 음수 여부, pct: % 여부 }
      const state = {
        tokens: [],          // 확정된 토큰들
        entry: null,         // 지금 입력 중인 피연산자 (없으면 null)
        justEvaluated: false,// 방금 = 를 눌러 결과를 보여주는 중인지
        result: null,        // 결과 피연산자
        lastExpr: '',        // 위쪽 줄에 표시할 마지막 식 (예: 2+3×4=)
        repeat: null,        // = 반복용 { op, operand }
        hasError: false
      };

      class CalcError extends Error {}

      function resetState() {
        state.tokens = [];
        state.entry = null;
        state.justEvaluated = false;
        state.result = null;
        state.lastExpr = '';
        state.repeat = null;
        state.hasError = false;
      }

      // ===== 피연산자 도우미 =====
      function makeOperand(digits, neg, pct) {
        return { digits: digits, neg: !!neg, pct: !!pct };
      }

      function operandValue(o) {
        const v = Number(o.digits);
        return o.neg ? -v : v;
      }

      function operandFromNumber(n) {
        const s = formatNumber(n);
        return s.charAt(0) === '-' ? makeOperand(s.slice(1), true) : makeOperand(s);
      }

      function finalizeEntry() {
        // "12." 처럼 소수점으로 끝나면 정리
        const e = state.entry;
        if (e && e.digits.endsWith('.')) e.digits = e.digits.slice(0, -1) || '0';
      }

      function countDigits(str) {
        return str.replace(/[^0-9]/g, '').length;
      }

      // ===== 숫자 포맷 =====
      function formatNumber(n) {
        let rounded = Number.parseFloat(n.toPrecision(15));
        if (Object.is(rounded, -0)) rounded = 0;
        const abs = Math.abs(rounded);
        if (abs >= 1e15 || (abs !== 0 && abs < 1e-9)) {
          return rounded.toExponential(14).replace(/\.?0+e/, 'e');
        }
        return String(rounded);
      }

      // '1234567.50' → '1,234,567.50' (입력 중인 소수부는 그대로 유지)
      function groupDigits(digits) {
        if (/e/i.test(digits)) return digits;
        const parts = digits.split('.');
        const grouped = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return parts.length > 1 ? grouped + '.' + parts[1] : grouped;
      }

      function formatOperand(o, isFirst) {
        let s = groupDigits(o.digits);
        if (o.pct) s += '%';
        if (o.neg) s = isFirst ? '−' + s : '(−' + s + ')'; // 식 중간의 음수는 괄호로
        return s;
      }

      function formatTokens(list) {
        return list.map(function (t, i) {
          return i % 2 === 0 ? formatOperand(t, i === 0) : OP_SYMBOLS[t];
        }).join('');
      }

      // ===== 계산: 연산자 우선순위 (×, ÷ 먼저 → +, − 나중) =====
      function evaluateList(list) {
        // 1단계: ×, ÷ 로 묶인 '항(term)'들을 먼저 계산
        const terms = [];
        let term = null;
        for (let i = 0; i < list.length; i += 2) {
          const o = list[i];
          const v = operandValue(o);
          const opBefore = i === 0 ? '+' : list[i - 1];

          if (opBefore === '*' || opBefore === '/') {
            const val = o.pct ? v / 100 : v;
            if (opBefore === '/') {
              if (val === 0) throw new CalcError('0으로 나눌 수 없습니다.');
              term.value /= val;
            } else {
              term.value *= val;
            }
            term.pctRaw = null; // 곱셈/나눗셈이 섞이면 단순 % 항이 아님
          } else {
            if (term) terms.push(term);
            term = {
              sign: opBefore === '-' ? -1 : 1,
              value: o.pct ? v / 100 : v,
              pctRaw: o.pct ? v : null
            };
          }
        }
        terms.push(term);

        // 2단계: +, − 를 왼쪽부터 계산
        // Apple 방식 %: 100 + 10% = 110 (앞까지 합계의 10%를 더함)
        let sum = 0;
        terms.forEach(function (t, idx) {
          if (t.pctRaw !== null && idx > 0) {
            sum += t.sign * sum * t.pctRaw / 100;
          } else {
            sum += t.sign * t.value;
          }
        });

        if (!Number.isFinite(sum)) throw new CalcError('결과가 너무 커서 표시할 수 없습니다.');
        return sum;
      }

      // ===== 버튼별 동작 =====
      function inputDigit(d) {
        if (state.justEvaluated) resetState(); // 결과 뒤 숫자 → 새 계산
        const e = state.entry;
        if (e === null || /e/i.test(e.digits)) {
          state.entry = makeOperand(d);
          return;
        }
        if (e.pct) {
          showMessage('% 뒤에는 연산자를 먼저 입력하세요.');
          return;
        }
        if (countDigits(e.digits) >= MAX_DIGITS) {
          showMessage('숫자는 최대 ' + MAX_DIGITS + '자리까지 입력할 수 있습니다.');
          return;
        }
        e.digits = e.digits === '0' ? d : e.digits + d;
      }

      function inputDot() {
        if (state.justEvaluated) resetState();
        const e = state.entry;
        if (e === null) {
          state.entry = makeOperand('0.');
          return;
        }
        if (e.pct) {
          showMessage('% 뒤에는 연산자를 먼저 입력하세요.');
          return;
        }
        if (e.digits.includes('.') || /e/i.test(e.digits)) {
          showMessage('소수점은 한 번만 입력할 수 있습니다.');
          return;
        }
        e.digits += '.';
      }

      function chooseOperator(op) {
        if (state.justEvaluated) {
          // 결과에 이어서 계산: 결과가 식의 첫 숫자가 됨
          const r = state.result;
          resetState();
          state.tokens = [r, op];
          return;
        }
        if (state.entry !== null) {
          finalizeEntry();
          state.tokens.push(state.entry, op);
          state.entry = null;
          return;
        }
        if (state.tokens.length === 0) {
          state.tokens = [makeOperand('0'), op]; // 0 상태에서 연산자 → "0+"
          return;
        }
        state.tokens[state.tokens.length - 1] = op; // 연산자 연속 입력 → 교체
      }

      function finish(list) {
        state.lastExpr = formatTokens(list) + '=';
        const value = evaluateList(list); // 오류면 여기서 throw
        state.result = operandFromNumber(value);
        state.tokens = [];
        state.entry = null;
        state.justEvaluated = true;
      }

      function evaluate() {
        if (state.justEvaluated) {
          // = 반복: 2+3=== → 5, 8, 11
          if (state.repeat) finish([state.result, state.repeat.op, state.repeat.operand]);
          return;
        }
        finalizeEntry();
        const list = state.entry !== null ? state.tokens.concat([state.entry]) : state.tokens.slice();
        if (list.length > 0 && list.length % 2 === 0) {
          // "5+=" 처럼 연산자로 끝나면 Apple 계산기처럼 마지막 숫자를 한 번 더 사용 → 5+5
          const last = list[list.length - 2];
          list.push(makeOperand(last.digits, last.neg, last.pct));
        }
        if (list.length === 0) return;

        state.repeat = list.length >= 3
          ? { op: list[list.length - 2], operand: list[list.length - 1] }
          : null;
        finish(list);
      }

      function backspace() {
        if (state.justEvaluated) return;
        const e = state.entry;
        if (e !== null) {
          if (e.pct) {
            e.pct = false;
          } else if (e.digits.length <= 1 || /e/i.test(e.digits)) {
            state.entry = null;
          } else {
            e.digits = e.digits.slice(0, -1);
          }
          return;
        }
        if (state.tokens.length > 0) {
          state.tokens.pop();                // 마지막 연산자 삭제
          state.entry = state.tokens.pop();  // 그 앞 숫자를 다시 편집 가능하게
        }
      }

      // AC/C: 입력 중인 숫자가 있으면 C(그 숫자만 지움), 없으면 AC(전체 초기화)
      function clear() {
        if (state.entry !== null && !state.justEvaluated) {
          state.entry = null;
        } else {
          resetState();
        }
      }

      function toggleSign() {
        if (state.justEvaluated) {
          const r = state.result;
          resetState();
          state.entry = makeOperand(r.digits, !r.neg);
          return;
        }
        if (state.entry === null) {
          state.entry = makeOperand('0', true); // "−0" 상태에서 숫자를 치면 음수 입력
          return;
        }
        state.entry.neg = !state.entry.neg;
      }

      function percent() {
        if (state.justEvaluated) {
          const r = state.result;
          resetState();
          state.entry = operandFromNumber(operandValue(r) / 100);
          return;
        }
        if (state.entry === null) {
          showMessage('숫자를 먼저 입력하세요.');
          return;
        }
        if (state.entry.pct) return;
        finalizeEntry();
        state.entry.pct = true;
      }

      // ===== 화면 갱신 =====
      function showMessage(text) {
        msgEl.textContent = text;
      }

      function activeOperator() {
        const t = state.tokens;
        if (state.justEvaluated || state.entry !== null || t.length === 0 || t.length % 2 !== 0) return null;
        return t[t.length - 1];
      }

      function render() {
        let main, top = '';
        if (state.hasError) {
          main = '오류';
          top = state.lastExpr;
        } else if (state.justEvaluated) {
          main = formatOperand(state.result, true);
          top = state.lastExpr;
        } else {
          const list = state.entry !== null ? state.tokens.concat([state.entry]) : state.tokens;
          main = list.length ? formatTokens(list) : '0';
        }

        resultEl.value = main;
        exprEl.value = top;

        const len = main.length;
        resultEl.classList.toggle('long', len > 10 && len <= 13);
        resultEl.classList.toggle('longer', len > 13 && len <= 18);
        resultEl.classList.toggle('longest', len > 18);
        resultEl.classList.toggle('error', state.hasError);
        exprEl.scrollLeft = exprEl.scrollWidth;
        resultEl.scrollLeft = resultEl.scrollWidth;

        // AC ↔ C 전환
        const isC = state.entry !== null || state.justEvaluated;
        clearBtn.textContent = isC ? 'C' : 'AC';
        clearBtn.setAttribute('aria-label', isC ? '입력 지우기' : '전체 지우기');

        // 선택된 연산자 버튼 강조
        const active = activeOperator();
        opButtons.forEach(function (btn) {
          const on = btn.dataset.value === active;
          btn.classList.toggle('active', on);
          btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      }

      // 3D 장면에게 알림
      function emit(action) {
        let particleText = null;
        if (state.hasError) {
          particleText = null;
        } else if (state.justEvaluated) {
          particleText = formatOperand(state.result, true);
        } else if (state.entry !== null) {
          particleText = formatOperand(state.entry, true);
        }
        document.dispatchEvent(new CustomEvent('calc:input', {
          detail: {
            action: action,
            particleText: particleText,
            operator: activeOperator(),
            evaluated: action === 'equals' && state.justEvaluated,
            hasError: state.hasError
          }
        }));
      }

      function handle(action, value) {
        showMessage('');

        if (state.hasError) {
          resetState();
          if (action !== 'digit' && action !== 'dot') {
            render();
            emit('clear');
            return;
          }
        }

        try {
          switch (action) {
            case 'digit': inputDigit(value); break;
            case 'dot': inputDot(); break;
            case 'operator': chooseOperator(value); break;
            case 'equals': evaluate(); break;
            case 'backspace': backspace(); break;
            case 'clear': clear(); break;
            case 'sign': toggleSign(); break;
            case 'percent': percent(); break;
          }
        } catch (err) {
          if (!(err instanceof CalcError)) throw err;
          state.hasError = true;
          state.tokens = [];
          state.entry = null;
          state.justEvaluated = false;
          state.repeat = null;
          showMessage(err.message);
        }

        render();
        emit(action);
      }

      // ===== 이벤트 연결 =====
      // 모든 버튼(= 포함)을 click 한 곳에서 처리한다.
      // = 는 type="submit"이지만 click의 기본 동작(폼 제출)을 막고 직접 계산하므로
      // 브라우저마다 submit 처리 방식이 달라도 결과가 같다.
      form.addEventListener('click', function (e) {
        const btn = e.target.closest('button');
        if (!btn || !form.contains(btn)) return;
        e.preventDefault();

      });

      // 안전장치: 다른 경로로 폼이 제출되더라도 새로고침 대신 계산
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        handle('equals');
      });

      const KEY_MAP = {
        '+': ['operator', '+'], '-': ['operator', '-'],
        '*': ['operator', '*'], '/': ['operator', '/'],
        '.': ['dot'], '%': ['percent'],
        'Enter': ['equals'], '=': ['equals'],
        'Backspace': ['backspace'], 'Escape': ['clear'], 'Delete': ['clear']

      // 한글 입력 모드(IME)에서는 e.key가 'Process'로 들어올 수 있어서
      // 물리 키 위치(e.code)로 한 번 더 판단한다.
      function mapByCode(e) {
        const c = e.code || '';
        let m = /^(?:Digit|Numpad)([0-9])$/.exec(c);
        if (m) {
          if (c.indexOf('Digit') === 0 && e.shiftKey) {
            if (m[1] === '8') return ['operator', '*'];
            if (m[1] === '5') return ['percent'];
            return null;
          }
          return ['digit', m[1]];
        }
        switch (c) {
          case 'Equal': return e.shiftKey ? ['operator', '+'] : ['equals'];
          case 'NumpadEqual':
          case 'Enter':
          case 'NumpadEnter': return ['equals'];
          case 'NumpadAdd': return ['operator', '+'];
          case 'Minus':
          case 'NumpadSubtract': return ['operator', '-'];
          case 'NumpadMultiply': return ['operator', '*'];
          case 'Slash':
          case 'NumpadDivide': return ['operator', '/'];
          case 'Period':
          case 'NumpadDecimal': return ['dot'];
          case 'Backspace': return ['backspace'];
          case 'Escape':
          case 'Delete': return ['clear'];

      }

      document.addEventListener('keydown', function (e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        let mapped = null;
        if (/^[0-9]$/.test(e.key)) {
          mapped = ['digit', e.key];
        } else if (Object.prototype.hasOwnProperty.call(KEY_MAP, e.key)) {
          mapped = KEY_MAP[e.key];
        } else {
          mapped = mapByCode(e);
        }
        if (!mapped) return;
        e.preventDefault();
        // 마우스로 눌렀던 버튼에 남은 포커스 테두리가 '선택됨'처럼 보이지 않도록 해제
        if (document.activeElement && form.contains(document.activeElement)) {
          document.activeElement.blur();
        }
        handle(mapped[0], mapped[1]);
        flashButton(mapped[0], mapped[1]);
      });

      function flashButton(action, value) {
        let selector = '[data-action="' + action + '"]';
        if (value !== undefined) selector += '[data-value="' + value + '"]';
        const btn = form.querySelector(selector);
        if (!btn) return;
        btn.classList.add('pressed');
        setTimeout(function () { btn.classList.remove('pressed'); }, 100);
      }

      render();

  <!-- ================================================================
       PART 2. 직접 만든 미니 3D 엔진 (three.js 없이 Canvas 2D만 사용)
       - 3D 회전 행렬 + 원근 투영으로 점을 화면에 그림
       - 파티클마다 '목표 위치'로 끌려가는 스프링 물리
       - 계산기 입력에 따라 목표 모양(숫자, 토러스, DNA 등)이 바뀜

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext && canvas.getContext('2d');
      if (!ctx) return; // 캔버스를 지원하지 않는 환경이면 계산기만 동작

      const hud = document.getElementById('hud');
      const rootStyle = document.documentElement.style;

        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const TAU = Math.PI * 2;

      const px = new Float32Array(COUNT), py = new Float32Array(COUNT), pz = new Float32Array(COUNT); // 위치
      const vx = new Float32Array(COUNT), vy = new Float32Array(COUNT), vz = new Float32Array(COUNT); // 속도
      const bx = new Float32Array(COUNT), by = new Float32Array(COUNT), bz = new Float32Array(COUNT); // 목표 위치
      const rnd = new Float32Array(COUNT);    // 파티클별 고정 난수
      const rnd2 = new Float32Array(COUNT);

      for (let i = 0; i < COUNT; i++) {
        rnd[i] = Math.random();
        rnd2[i] = Math.random();
        // 시작할 때 멀리 흩어져 있다가 구 모양으로 모여드는 인트로
        px[i] = (Math.random() - 0.5) * 2400;
        py[i] = (Math.random() - 0.5) * 2400;
        pz[i] = (Math.random() - 0.5) * 2400;
      }

      // ===== 배경 별 =====
      const STAR_COUNT = reduceMotion ? 120 : 320;
      const stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * 2 - 1,
          y: Math.random() * 2 - 1,
          d: 0.2 + Math.random() * 0.8,      // 깊이 (시차 효과용)
          p: Math.random() * TAU              // 반짝임 위상
        });
      }

      // ===== 화면 크기 / 3D 장면 중심 =====
      let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, worldScale = 1;

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;

          regionW = W - 320 - W * 0.07 * 2;
          regionH = H;

          cy = H / 2;

      // ===== 글로우 스프라이트 미리 그려두기 (매 프레임 그라디언트 생성 X) =====
      const HUE_BUCKETS = 24;
      const sprites = [];

        grad.addColorStop(0.22, 'hsla(' + h + ', 100%, 65%, 0.85)');

      // ===== 모양(Shape) 생성기: i번째 파티클의 목표 좌표를 out에 기록 =====
      const SHAPES = {
        // 피보나치 구: 구 표면에 점을 거의 균일하게 배치
        sphere: function (i, n, out) {
          const y = 1 - ((i + 0.5) / n) * 2;
          const r = Math.sqrt(1 - y * y);
          const a = i * 2.399963229728653; // 황금각
          out[0] = Math.cos(a) * r * 200;
          out[1] = y * 200;
          out[2] = Math.sin(a) * r * 200;
        },
        // + : 도넛(토러스)
        torus: function (i, n, out) {
          const u = TAU * ((i * GOLDEN) % 1);
          const v = TAU * (i / n);
          const R = 165, r = 58;
          out[0] = (R + r * Math.cos(u)) * Math.cos(v);
          out[1] = r * Math.sin(u);
          out[2] = (R + r * Math.cos(u)) * Math.sin(v);
        },
        // − : 출렁이는 물결 평면 (y는 매 프레임 계산)
        wave: function (i, n, out) {
          const side = Math.ceil(Math.sqrt(n));
          out[0] = ((i % side) / (side - 1) - 0.5) * 480;
          out[1] = 0;
          out[2] = (Math.floor(i / side) / (side - 1) - 0.5) * 480;
        },
        // × : DNA 이중 나선
        helix: function (i, n, out) {
          const strand = i % 3;
          if (strand < 2) {
            const y = ((i / n) - 0.5) * 480;
            const a = y * 0.035 + strand * Math.PI;
            out[0] = Math.cos(a) * 105;
            out[1] = y;
            out[2] = Math.sin(a) * 105;
          } else {

            const y = ((k + 0.5) / 26 - 0.5) * 480;
            const a = y * 0.035;
            const t = rnd2[i] * 2 - 1;
            out[0] = Math.cos(a) * 105 * t;
            out[1] = y;
            out[2] = Math.sin(a) * 105 * t;

        // ÷ : 점-막대-점 모양을 3D로

        const damping = Math.pow(0.87, f);
        const baseHue = hue;
        const alphaMul = mode === 'text' ? 0.7 : 1; // 글자는 밀도가 높아 하얗게 타는 것 방지

        for (let i = 0; i < COUNT; i++) {
          // 목표 위치 (모드에 따라 시간에 따라 변형)
          let tx = bx[i], ty = by[i], tz = bz[i];

            tx *= k; ty *= k; tz *= k;
          } else if (mode === 'wave') {
            ty = Math.sin(tx * 0.025 + time * 2.2) * 30 + Math.cos(tz * 0.03 + time * 1.7) * 30;
          }

          // 스프링: 가속도 = (목표 - 현재) × 강도, 속도는 감쇠
          vx[i] = (vx[i] + (tx - px[i]) * spring) * damping;
          vy[i] = (vy[i] + (ty - py[i]) * spring) * damping;
          vz[i] = (vz[i] + (tz - pz[i]) * spring) * damping;
          px[i] += vx[i] * f;
          py[i] += vy[i] * f;
          pz[i] += vz[i] * f;

          // Y축 회전
          const x1 = px[i] * cY - pz[i] * sY;
          const z1 = px[i] * sY + pz[i] * cY;
          // X축 회전
          const y2 = py[i] * cX - z1 * sX;
          const z2 = py[i] * sX + z1 * cX;

          // 원근 투영: 멀수록(깊이가 클수록) 작고 중앙으로 모임
          const depth = z2 + CAM_Z;
          if (depth < 40) continue; // 카메라 뒤
          const scale = (FOV / depth) * worldScale;
          const sx = cx + x1 * scale;
          const sy = cy + y2 * scale;

          const size = 9 * scale;
          if (sx < -size || sx > W + size || sy < -size || sy > H + size) continue;

          // 색: 기본 색상 + 높이에 따른 그라디언트 + 개별 편차
          let h = baseHue + py[i] * 0.18 + rnd[i] * 40;
          h = ((h % 360) + 360) % 360;
          const bucket = Math.floor(h / (360 / HUE_BUCKETS)) % HUE_BUCKETS;

          ctx.globalAlpha = Math.max(0.12, Math.min(1, 1.5 - depth / 1000)) * alphaMul;
          ctx.drawImage(sprites[bucket], sx - size / 2, sy - size / 2, size, size);
        }

        // --- 5) 블랙홀 중심 (오류 모드) ---
        ctx.globalCompositeOperation = 'source-over';
        if (mode === 'vortex') {
          const r = 48 * worldScale * (1 + 0.05 * Math.sin(time * 6));
          const g = ctx.createRadialGradient(cx, cy, r * 0.6, cx, cy, r * 1.6);
          g.addColorStop(0, 'rgba(0,0,0,1)');
          g.addColorStop(0.55, 'rgba(0,0,0,0.95)');
          g.addColorStop(0.7, 'rgba(255,70,40,0.55)');
          g.addColorStop(1, 'rgba(255,40,40,0)');
          ctx.globalAlpha = 1;
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(cx, cy, r * 1.6, 0, TAU);
          ctx.fill();
        }

        // --- 6) 충격파 고리 ---
        for (let i = rings.length - 1; i >= 0; i--) {
          const ring = rings[i];
          if (ring.delay > 0) { ring.delay -= dt; continue; }
          ring.r += dt * 900 * worldScale;
          ring.life -= dt * 1.1;
          if (ring.life <= 0) { rings.splice(i, 1); continue; }
          ctx.globalAlpha = ring.life * 0.8;
          ctx.strokeStyle = 'hsl(' + (hue % 360) + ', 100%, 72%)';
          ctx.lineWidth = 2.5 * ring.life + 0.5;
          ctx.beginPath();
          ctx.ellipse(cx, cy, ring.r, ring.r * 0.32, 0, 0, TAU);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        // --- 7) HUD ---
        frames++;
        fpsTimer += dt;
        if (fpsTimer >= 0.5) {
          fps = Math.round(frames / fpsTimer);
          frames = 0;
          fpsTimer = 0;
          hud.textContent =
            COUNT + ' particles · ' + fps + ' fps · mode: ' + mode + '\n' +
            '마우스로 시점 이동 · 빈 공간 클릭 = 폭발 · 키보드 입력 가능';
        }

        requestAnimationFrame(frame);
      }

      setShape('sphere');
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>

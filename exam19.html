<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $(document).ready(function(){
        $('button').click(function() {
            $('h1').css('color', 'red');
            $('p').css('background-color','yellow');
            $('img').attr('src', 'https://placehold.co/200x200');
            $('#t1').text('<a href="www.syu.ac.kr">text()</a>');
            $('#t2').html('<a href="www.syu.ac.kr">text()</a>');
            $('#t1').toggleClass('c1'); // toggleClass : 클래스가 있으면 제거, 없으면 추가
        });
    });
</script>
<style>
    .c1 {color: blue;}
</style>
    <body>
    <h1> jQuery 예제</h1>
    <p>삼육대학교</p>
    <P id="t1">인공지능융합학부</P>
    <P id="t2">웹프로그래밍</P>
    <img><br>
    <img src="https:// placehold.co/100x100"> <br>
    <button>클릭하세요.</button>
</body>
</html>
